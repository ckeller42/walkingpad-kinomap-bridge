# Read the Docs build. docs/conf.py runs Doxygen itself when the XML is absent
# (which it always is on a fresh RTD checkout), so the API pages are generated
# there too rather than silently coming out empty.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
