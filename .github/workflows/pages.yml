name: pages
# Publishes the Sphinx site to GitHub Pages.
#
# NOTE: this repository is private on a free plan, where Pages is not
# available ("Your current plan does not support GitHub Pages for this
# repository"). The workflow is kept ready and correct so publishing starts
# working the moment either the repository is made public or the account is
# upgraded - no configuration archaeology needed later.
#
# Until then the same site is produced by the `docs` job in ci.yml and attached
# to every run as the `docs-site` artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      - run: pip install -r docs/requirements.txt
      - name: doxygen (XML for breathe)
        run: mkdir -p build/doxygen && doxygen Doxyfile
      - name: sphinx, warnings are errors
        run: sphinx-build -b html -W --keep-going docs build/sphinx
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/sphinx

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
