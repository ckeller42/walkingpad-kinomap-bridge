# Single source of truth for the FTMS (Kinomap-side) protocol the bridge serves.
# docs/protocol/reference.md and docs/protocol/frame-layouts.md are generated
# from this file by tools/gen_protocol_reference.py and
# tools/gen_frame_layouts.py. Do not restate these facts by hand in
# docs/protocol/.
#
# Provenance (on every fact; a fact without its own inherits its parent's):
#   measured    observed on real hardware (docs/test-log.md is the record).
#               For this file that means: read back over the air from the
#               bridge's own GATT server, Stage 0. It does NOT mean Kinomap
#               was observed doing it; that is Stage 1.
#   community   from the Bluetooth FTMS specification as implemented by the
#               open-source bridges, or the design doc
#   vendor-app  from the Kinomap decompile (ag8.java / uf8.java)
# `evidence` says where the fact is recorded. Where this file and
# docs/test-log.md differ, the test log wins.

schema_version: 1
protocol: ftms
title: FTMS (bridge as peripheral, Kinomap as central)
role: The bridge is the BLE peripheral; Kinomap is the central.
summary: >-
  Fitness Machine Service 1826, minimal subset. Kinomap's only control channel
  is Set Target Speed; Start and Stop are brand-gated in the app and are never
  sent by it. See the constraints.

advertisement:
  name: WalkingPad Bridge
  service: "1826"
  provenance: measured
  evidence: "test-log: Stage 0, advertisement"

service:
  uuid: "1826"
  name: Fitness Machine
  provenance: measured
  evidence: "test-log: Stage 0, GATT table"

characteristics:
  - uuid: 2ACC
    name: Fitness Machine Feature
    properties: [read]
    payload: feature
    provenance: measured
    evidence: "test-log: Stage 0, characteristic values"
    notes: >-
      Trap: shorter than 8 bytes, or bit 0 of the Target Setting Features
      clear, and Kinomap connects, shows data and never commands a speed.
  - uuid: 2AD4
    name: Supported Speed Range
    properties: [read]
    payload: speed_range
    provenance: measured
    evidence: "test-log: Stage 0, characteristic values"
    notes: >-
      Trap: if absent, Kinomap clamps every target speed to 0 km/h. Kinomap
      reads only min and max; the increment merely has to be there.
  - uuid: 2ACD
    name: Treadmill Data
    properties: [notify]
    payload: treadmill_data
    provenance: measured
    evidence: "test-log: Stage 0, GATT table (properties); payload layout is design, not yet read back"
    notes: >-
      Deliberately minimal. Kinomap's flags parser is fragile, so no optional
      field is ever added. Kinomap derives distance itself from speed.
  - uuid: 2AD9
    name: Fitness Machine Control Point
    properties: [write, indicate]
    payload: control_point_request
    response_payload: control_point_response
    provenance: measured
    evidence: "test-log: Stage 0, GATT table"
    notes: Every write is answered with an indication, success or not.
  - uuid: 2ADA
    name: Fitness Machine Status
    properties: [notify]
    payload: machine_status
    provenance: measured
    evidence: "test-log: Stage 0, GATT table"
  - uuid: 2A29
    name: Manufacturer Name String (Device Information 180A)
    properties: [read]
    value: "WalkingPad Bridge"
    provenance: measured
    evidence: "test-log: Stage 0, characteristic values"
    notes: Must not be "decathlon"; Kinomap switches to vendor quirk paths on that string.
  - uuid: 2A24
    name: Model Number String (Device Information 180A)
    properties: [read]
    value: "R1 Pro FTMS Bridge"
    provenance: measured
    evidence: "test-log: Stage 0, characteristic values"

absent_characteristics:
  - uuid: 2AD5
    name: Supported Inclination Range
    reason: The R1 Pro has no incline. No inclination bit is set in 2ACC either.
    provenance: measured
    evidence: "test-log: Stage 0, pass criteria (2AD5 ABSENT)"

# Byte-level payload layouts. `value` marks a constant, `unit`/`scale` give
# the engineering unit (scale is the multiplier from raw to unit).
payloads:
  - id: feature
    title: Fitness Machine Feature (2ACC)
    direction: read
    length: 8
    provenance: measured
    evidence: "test-log: Stage 0, characteristic values"
    fields:
      - {offset: 0, size: 4, name: fitness_machine_features, type: u32le, value: 0x00000000}
      - offset: 4
        size: 4
        name: target_setting_features
        type: u32le
        value: 0x00000001
        bits:
          - {bit: 0, name: speed_target_setting, state: set, note: "Required; Kinomap only sends Set Target Speed if this is set"}
          - {bit: 1, name: inclination_target_setting, state: clear}
          - {bit: 2, name: resistance_target_setting, state: clear}
    example: "00 00 00 00 01 00 00 00"
  - id: speed_range
    title: Supported Speed Range (2AD4)
    direction: read
    length: 6
    provenance: measured
    evidence: "test-log: Stage 0, characteristic values"
    fields:
      - {offset: 0, size: 2, name: minimum_speed, type: u16le, unit: km/h, scale: 0.01, value: 50}
      - {offset: 2, size: 2, name: maximum_speed, type: u16le, unit: km/h, scale: 0.01, value: 600, note: "6.00 km/h: the belt's walking-mode limit with the handrail folded"}
      - {offset: 4, size: 2, name: minimum_increment, type: u16le, unit: km/h, scale: 0.01, value: 10}
    example: "32 00 58 02 0a 00"
  - id: treadmill_data
    title: Treadmill Data (2ACD)
    direction: notify
    length: 4
    provenance: vendor-app
    evidence: "design doc: minimal payload, chosen around the ag8.java z() flags parser"
    fields:
      - {offset: 0, size: 2, name: flags, type: u16le, value: 0x0000, note: "No optional fields present. Kinomap reads this field big-endian; with 0x0000 both readings agree."}
      - {offset: 2, size: 2, name: instantaneous_speed, type: u16le, unit: km/h, scale: 0.01}
    example: "00 00 f4 01"
    example_note: 5.00 km/h
  - id: control_point_request
    title: Control Point request (2AD9, write)
    direction: write
    length: variable
    provenance: vendor-app
    evidence: "design doc: Kinomap side, from ag8.java and uf8.java"
    fields:
      - {offset: 0, size: 1, name: opcode, type: u8, enum: control_opcode}
      - {offset: 1, size: 2, name: parameter, type: u16le, unit: km/h, scale: 0.01, note: "Only for opcode 0x02 (Set Target Speed); other opcodes carry no parameter."}
    example: "02 f4 01"
    example_note: Set Target Speed 5.00 km/h
  - id: control_point_response
    title: Control Point response (2AD9, indicate)
    direction: indicate
    length: 3
    provenance: vendor-app
    evidence: "design doc: Kinomap expects 80 <request-opcode> 01"
    fields:
      - {offset: 0, size: 1, name: response_code, type: u8, value: 0x80}
      - {offset: 1, size: 1, name: request_opcode, type: u8, note: "Echo of the opcode being answered."}
      - {offset: 2, size: 1, name: result, type: u8, value: 0x01, note: "Success. The bridge never returns an error; see constraints."}
    example: "80 02 01"
    example_note: Success for Set Target Speed
  - id: machine_status
    title: Fitness Machine Status (2ADA)
    direction: notify
    length: 1
    provenance: vendor-app
    evidence: "design doc: ag8.java line 398"
    fields:
      - {offset: 0, size: 1, name: op_code, type: u8, enum: status_opcode}
    example: "04"
    example_note: Started or resumed by the user

enums:
  control_opcode:
    field: 2AD9 request byte 0
    values:
      - {value: 0x00, name: request_control, meaning: "Sent on discovering 2AD9", direction: kinomap-sends, provenance: vendor-app, evidence: "design doc: ag8.java"}
      - {value: 0x02, name: set_target_speed, meaning: "uint16 LE, km/h x 100; sent whenever the target changes", direction: kinomap-sends, provenance: vendor-app, evidence: "design doc: ag8.java"}
      - {value: 0x07, name: start_resume, meaning: "Sent only after we notify 2ADA byte 0 = 0x04", direction: kinomap-sends, provenance: vendor-app, evidence: "design doc: ag8.java line 398"}
      - {value: 0x08, name: stop_pause, meaning: "08 01 stop / 08 02 pause. NEVER sent on this machine (brand-gated)", direction: never-sent, provenance: vendor-app, evidence: "design doc: ag8.java lines 138-166"}
  status_opcode:
    field: 2ADA byte 0
    values:
      - {value: 0x04, name: started_or_resumed_by_user, meaning: "Provokes Kinomap to write 07 and start its training session", provenance: vendor-app, evidence: "design doc: ag8.java line 398"}

constraints:
  - id: stop_sentinel
    statement: >-
      Kinomap's generic treadmill stop is a Set Target Speed of exactly 1.00
      km/h (stop() calls y0(1.0f)); it writes no stop opcode. The bridge
      treats that value as a stop, not a speed.
    key: stop_sentinel_kmh
    value: 1.00
    unit: km/h
    provenance: vendor-app
    evidence: "design doc: ag8.java:183"
  - id: kinomap_never_sends_stop
    statement: Kinomap never sends opcode 0x08 to this machine; Start/Stop handling is gated on the manufacturer string being "decathlon".
    key: kinomap_sends_stop_opcode
    value: false
    provenance: vendor-app
    evidence: "design doc: ag8.java lines 138, 152, 166"
  - id: start_only_after_status
    statement: Kinomap sends opcode 0x07 only in response to a 2ADA notification with byte 0 = 0x04.
    key: start_requires_status_0x04
    value: true
    provenance: vendor-app
    evidence: "design doc: ag8.java line 398"
  - id: response_format
    statement: Every control point write is answered with an indication 80 <request-opcode> 01. Silence or an error breaks the handshake (unbounded retry loops).
    key: control_point_always_success
    value: true
    provenance: vendor-app
    evidence: "design doc: ag8.java lines 311, 323, 341-344"
  - id: speed_unit
    statement: Speeds in 2ACD, 2AD4 and Set Target Speed are uint16 little-endian in units of 0.01 km/h.
    key: speed_unit_kmh
    value: 0.01
    unit: km/h
    provenance: measured
    evidence: "test-log: Stage 0, 2AD4 read back as 0.50 / 6.00 / 0.10"
  - id: advertised_max_speed
    statement: The advertised maximum is 6.00 km/h, so Kinomap clamps targets app-side and none above it reach the bridge.
    key: advertised_max_speed_kmh
    value: 6.00
    unit: km/h
    provenance: measured
    evidence: "test-log: Stage 0, 2AD4 read back"
  - id: no_inclination
    statement: 2AD5 is absent and 2ACC advertises no inclination or resistance target setting.
    key: inclination_supported
    value: false
    provenance: measured
    evidence: "test-log: Stage 0, pass criteria"
  - id: distance_derived_by_kinomap
    statement: Kinomap integrates instantaneous speed itself once per second; Total Distance in 2ACD is not needed.
    key: kinomap_derives_distance
    value: true
    provenance: vendor-app
    evidence: "design doc: uf8.java t0()"
  - id: flags_parser_quirk
    statement: Kinomap reads the 2ACD flags field big-endian with a x255 multiplier. Any optional field risks silently corrupting later offsets.
    key: flags_must_be_zero
    value: true
    provenance: vendor-app
    evidence: "design doc: ag8.java z()"
