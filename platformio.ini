[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17

; Flags every board env shares. Not an env itself: FW_ENV must be set exactly
; once per env, and a child env re-adding it on top of an inherited
; ${env:<parent>.build_flags} draws a "FW_ENV redefined" warning per file.
[cores3_base]
build_flags =
    -DPOLICY_DEADBAND_TENTHS=3
    -DPOLICY_MIN_COMMAND_INTERVAL_MS=1000
    ; CoreS3 has no UART bridge: without this Serial goes to UART0 and vanishes.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Stamped by CI from the git tag; "dev" locally. OTA compares this against
    ; the manifest, so a local build never matches a release and is never
    ; silently "up to date".
    -DFW_VERSION=\"${sysenv.FW_VERSION}\"
    -Wall -Wextra

[env:cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
; Two app slots: an OTA that fails must leave the running firmware intact.
board_build.partitions = partitions_ota.csv
; Policy tunables (lib/policy is a separate TU, so config.h cannot set them)
; are in [cores3_base]. FW_ENV names this image: OTA refuses a manifest whose
; "env" differs, so a bench board never installs the real-belt image.
build_flags =
    ${cores3_base.build_flags}
    -DFW_ENV=\"cores3\"
lib_deps =
    m5stack/M5Unified
    h2zero/NimBLE-Arduino
test_ignore = *

; Same firmware with the simulated belt. Keeps the non-default path building.
[env:cores3_sim]
extends = env:cores3
build_flags =
    ${cores3_base.build_flags}
    -DFW_ENV=\"cores3_sim\"
    -DUSE_SIM_BELT=1

; Screenshot build: simulated belt + one frame per UI phase over serial
; (see src/shot.h, tools/capture_shots.py). Never for daily use.
[env:cores3_shot]
extends = env:cores3_sim
build_flags =
    ${cores3_base.build_flags}
    -DFW_ENV=\"cores3_shot\"
    -DUSE_SIM_BELT=1
    -DUI_SCREENSHOT=1

; Minimal touch probe: M5Unified only, none of this project's code, and the
; stock partition table. Separates "the bridge's firmware breaks touch" from
; "the hardware does not report touch" - see tools/touchtest/touchtest.cpp.
[env:cores3_touchtest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../tools/touchtest/touchtest.cpp>
lib_deps = m5stack/M5Unified
test_ignore = *
