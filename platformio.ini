[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17

[env:cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
; Policy tunables (lib/policy is a separate TU, so config.h cannot set them).
build_flags =
    -DPOLICY_DEADBAND_TENTHS=3
    -DPOLICY_MIN_COMMAND_INTERVAL_MS=1000
lib_deps =
    m5stack/M5Unified
    h2zero/NimBLE-Arduino
test_ignore = *
